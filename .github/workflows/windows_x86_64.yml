name: Build Windows x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            tar
            curl
            unzip
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Build and install Lua 5.3.6 (static)
        shell: msys2 {0}
        run: |
          set -e
          cd /tmp
          curl -RL -O https://www.lua.org/ftp/lua-5.3.6.tar.gz
          tar -xzf lua-5.3.6.tar.gz
          cd lua-5.3.6
          make mingw
          make install INSTALL_TOP=/tmp/lua-5.3.6 TO_BIN="lua.exe luac.exe lua53.dll"
          echo "=== Installed Lua layout ==="
          ls -la /tmp/lua-5.3.6/bin/
          ls -la /tmp/lua-5.3.6/include/
          ls -la /tmp/lua-5.3.6/lib/

      - name: Install LuaRocks 3.11.1
        shell: msys2 {0}
        run: |
          set -e
          cd /tmp
          curl -RL -O https://luarocks.org/releases/luarocks-3.11.1.tar.gz
          tar -xzf luarocks-3.11.1.tar.gz
          cd luarocks-3.11.1
          ./configure \
            --with-lua=/tmp/lua-5.3.6 \
            --lua-version=5.3
          make build
          make install
          which luarocks
          luarocks --version

      - name: Install luastatic
        shell: msys2 {0}
        run: |
          set -e
          luarocks install luastatic
          which luastatic

      - name: Build perseu-srv.exe
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/pegasus_perseu_runner/source"
          test -f pegasus-perseu.lua
          luastatic pegasus-perseu.lua \
            /tmp/lua-5.3.6/lib/liblua.a \
            -I/tmp/lua-5.3.6/include \
            -static \
            -static-libgcc \
            -o perseu-srv.exe
          test -f perseu-srv.exe
          ls -la perseu-srv.exe

      - name: Move binary to application/windows_x86_64
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/pegasus_perseu_runner"
          mkdir -p application/windows_x86_64
          mv source/perseu-srv.exe application/windows_x86_64/
          ls -la application/windows_x86_64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perseu-srv-windows-x86_64
          path: pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push binary
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build(windows): update perseu-srv.exe [skip ci]"
            git push
          fi
