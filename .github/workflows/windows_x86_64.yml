name: Build Windows x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MinGW (for luawinmulti)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install mingw -y --no-progress
          $mingw = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw\tools\install" -Recurse -Filter "gcc.exe" | Select-Object -First 1
          $mingwDir = $mingw.DirectoryName
          Write-Host "MinGW dir: $mingwDir"
          Add-Content -Path $env:GITHUB_PATH -Value $mingwDir

      - name: Build Lua 5.3.6 + LuaRocks via luawinmulti
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone https://github.com/Tieske/luawinmulti.git C:\luawinmulti
          Set-Location C:\luawinmulti
          .\make.bat --53 install C:\lua53
          Get-ChildItem C:\lua53

      - name: Configure Lua 5.3 environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem C:\lua53 -Recurse -Filter "*.exe" | Select-Object FullName
          Get-ChildItem C:\lua53 -Recurse -Filter "*.bat" | Select-Object FullName

          $setlua = Get-ChildItem -Path C:\lua53 -Recurse -Filter "setlua.bat" | Select-Object -First 1
          if ($setlua) {
            & $setlua.FullName 53
          }

          Add-Content -Path $env:GITHUB_PATH -Value "C:\lua53\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\lua53"

          Get-ChildItem C:\lua53 -Recurse -Filter "lua*.exe" | Select-Object FullName

      - name: Install luastatic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $luarocks = Get-ChildItem -Path C:\lua53 -Recurse -Filter "luarocks*.bat" | Select-Object -First 1
          Write-Host "luarocks: $($luarocks.FullName)"
          & $luarocks.FullName install luastatic
          Write-Host "=== luastatic location ==="
          Get-ChildItem -Path C:\lua53 -Recurse -Filter "luastatic*" | Select-Object FullName

      - name: Build perseu-srv.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location pegasus_perseu_runner/source

          # Localiza o luastatic.bat
          $luastatic = Get-ChildItem -Path C:\lua53 -Recurse -Filter "luastatic.bat" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $luastatic) {
            Write-Host "=== Listing luastatic* ==="
            Get-ChildItem -Path C:\lua53 -Recurse -Filter "luastatic*" | Select-Object FullName
            throw "luastatic.bat not found"
          }
          Write-Host "luastatic: $($luastatic.FullName)"

          $liblua = "C:\lua53\lib\liblua53.a"
          $includeDir = "C:\lua53\include\lua\5.3"

          # Chama o .bat via cmd /c
          cmd /c "`"$($luastatic.FullName)`" pegasus-perseu.lua `"$liblua`" `"-I$includeDir`" -static -static-libgcc -o perseu-srv.exe"

          if (-not (Test-Path perseu-srv.exe)) { throw "Build failed" }
          Get-Item perseu-srv.exe | Select-Object Name, Length

      - name: Move binary to application/windows_x86_64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "pegasus_perseu_runner/application/windows_x86_64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "pegasus_perseu_runner/source/perseu-srv.exe" "$dest/perseu-srv.exe" -Force
          Get-ChildItem $dest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perseu-srv-windows-x86_64
          path: pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build(windows): update perseu-srv.exe [skip ci]"
            git push
          } else {
            Write-Host "No changes to commit."
          }
