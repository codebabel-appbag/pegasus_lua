name: Build Windows x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download LuaRocks all-in-one (with Lua 5.3)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/luarocks/luarocks/releases/download/v3.11.1/luarocks-3.11.1-windows-64.zip"
          Invoke-WebRequest $url -OutFile luarocks.zip -UseBasicParsing
          Expand-Archive luarocks.zip -DestinationPath luarocks -Force
          Get-ChildItem luarocks -Recurse -Depth 1 | Select-Object FullName

      - name: Install luastatic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $luarocks = Get-ChildItem -Path luarocks -Recurse -Filter "luarocks.exe" | Select-Object -First 1
          Write-Host "Using: $($luarocks.FullName)"
          & $luarocks.FullName install luastatic
          Get-ChildItem -Path luarocks -Recurse -Filter "luastatic*" | Select-Object FullName

      - name: Build perseu-srv.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location pegasus_perseu_runner/source

          $luastatic = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "luastatic.bat" | Select-Object -First 1
          if (-not $luastatic) { $luastatic = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "luastatic.exe" | Select-Object -First 1 }
          Write-Host "luastatic: $($luastatic.FullName)"

          $luaRoot = Get-ChildItem -Path $env:GITHUB_WORKSPACE\luarocks -Recurse -Filter "lua.h" | Select-Object -First 1
          $includeDir = $luaRoot.DirectoryName
          $libDir = Get-ChildItem -Path $env:GITHUB_WORKSPACE\luarocks -Recurse -Filter "liblua*.a" | Select-Object -First 1
          Write-Host "include: $includeDir"
          Write-Host "lib: $($libDir.FullName)"

          & $luastatic.FullName pegasus-perseu.lua `
            "$($libDir.FullName)" `
            "-I$includeDir" `
            -static `
            -static-libgcc `
            -o perseu-srv.exe

          if (-not (Test-Path perseu-srv.exe)) { throw "perseu-srv.exe not built" }
          Get-Item perseu-srv.exe | Select-Object Name, Length

      - name: Move binary to application/windows_x86_64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "pegasus_perseu_runner/application/windows_x86_64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "pegasus_perseu_runner/source/perseu-srv.exe" "$dest/perseu-srv.exe" -Force
          Get-ChildItem $dest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perseu-srv-windows-x86_64
          path: pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pegasus_perseu_runner/application/windows_x86_64/perseu-srv.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build(windows): update perseu-srv.exe [skip ci]"
            git push
          } else {
            Write-Host "No changes to commit."
          }
